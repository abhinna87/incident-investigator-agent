name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Format, lint and typecheck.
      - run: npm run check

      # Unit tests. These deliberately need no Cloudflare account and no network,
      # so they run on a clean CI box — see vitest.config.ts for why they do not
      # load the app's vite config.
      - run: npm test
